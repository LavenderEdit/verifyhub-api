version: '3.8'

services:
  verifyhub-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: verifyhub:latest
    container_name: verifyhub-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - RUN_MODE=api
      - DATABASE_URL=postgresql://verifyhub_user:verifyhub_password@postgres:5432/verifyhub_db?schema=public
      - REDIS_URL=redis://redis:6379/0
      - JWT_ACCESS_SECRET=vh_access_secret_change_me_in_prod_at_least_32_chars
      - JWT_REFRESH_SECRET=vh_refresh_secret_change_me_in_prod_at_least_32_chars
      - COOKIE_DOMAIN=localhost
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=strict
      - ENCRYPTION_MASTER_KEY=8f6a9e1b2c3d4e5f6a7b8c9d0e1f2a3b
      - API_KEY_PEPPER=verifyhub_pepper_salt_secret_key_change_me
      - WEBHOOK_SIGNING_SECRET=vh_webhook_secret_change_me
      - WWEBJS_SESSION_PATH=/usr/src/app/wwebjs_sessions
      - WWEBJS_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      - RATE_LIMIT_DEFAULT_TTL=60
      - RATE_LIMIT_DEFAULT_LIMIT=100
      - OTP_DEFAULT_EXPIRATION_MINUTES=5
      - OTP_DEFAULT_LENGTH=6
    volumes:
      - wwebjs_sessions:/usr/src/app/wwebjs_sessions
    depends_on:
      - postgres
      - redis

  verifyhub-worker:
    image: verifyhub:latest
    container_name: verifyhub-worker
    restart: always
    command: node dist/main.js
    environment:
      - NODE_ENV=production
      - RUN_MODE=worker
      - DATABASE_URL=postgresql://verifyhub_user:verifyhub_password@postgres:5432/verifyhub_db?schema=public
      - REDIS_URL=redis://redis:6379/0
      - JWT_ACCESS_SECRET=vh_access_secret_change_me_in_prod_at_least_32_chars
      - JWT_REFRESH_SECRET=vh_refresh_secret_change_me_in_prod_at_least_32_chars
      - COOKIE_DOMAIN=localhost
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=strict
      - ENCRYPTION_MASTER_KEY=8f6a9e1b2c3d4e5f6a7b8c9d0e1f2a3b
      - API_KEY_PEPPER=verifyhub_pepper_salt_secret_key_change_me
      - WEBHOOK_SIGNING_SECRET=vh_webhook_secret_change_me
      - WWEBJS_SESSION_PATH=/usr/src/app/wwebjs_sessions
      - WWEBJS_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      - RATE_LIMIT_DEFAULT_TTL=60
      - RATE_LIMIT_DEFAULT_LIMIT=100
      - OTP_DEFAULT_EXPIRATION_MINUTES=5
      - OTP_DEFAULT_LENGTH=6
    volumes:
      - wwebjs_sessions:/usr/src/app/wwebjs_sessions
    depends_on:
      - verifyhub-api
      - postgres
      - redis

  postgres:
    image: postgres:18-alpine
    container_name: verifyhub-postgres
    restart: always
    environment:
      - POSTGRES_USER=verifyhub_user
      - POSTGRES_PASSWORD=verifyhub_password
      - POSTGRES_DB=verifyhub_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.0-alpine
    container_name: verifyhub-redis
    restart: always
    ports:
      - "6375:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  wwebjs_sessions:
